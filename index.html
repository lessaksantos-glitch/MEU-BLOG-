<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Basquete</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>/* Reset básico */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background-color: #f0f0f0;
    color: #333;
}

/* Cabeçalho */
header {
    background-color: #552583; /* Roxo Lakers */
    color: white;
    padding: 25px 0;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 25px;
}

nav a {
    color: #FFD700; /* Amarelo Lakers */
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    text-decoration: underline;
    color: white;
}

/* Conteúdo */
main {
    padding: 20px;
}

section {
    margin-bottom: 50px;
}

section h2 {
    margin-bottom: 20px;
    color: #552583;
    border-bottom: 2px solid #FFD700;
    display: inline-block;
    padding-bottom: 5px;
}

.post {
    background-color: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: transform 0.3s;
}

.post:hover {
    transform: translateY(-5px);
}

.post-img {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 15px;
}

.post h3 {
    margin-bottom: 10px;
    color: #333;
}

button {
    padding: 10px 15px;
    border: none;
    background-color: #FFD700;
    color: #552583;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    background-color: #e5c500;
}

/* Rodapé */
footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 20px 0;
    margin-top: 30px;
}</style>
<script>function lerMais(botao) {
    const post = botao.parentElement;
    const paragrafo = post.querySelector('p');

    if (botao.textContent === "Ler mais") {
        paragrafo.textContent += " https://www.nba.com/.";
        botao.textContent = "Ler menos";
    } else {
        paragrafo.textContent = paragrafo.textContent.split(" Aqui você")[0];
        botao.textContent = "Ler mais";
    }
}</script>
